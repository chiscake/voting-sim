# Home / Room bake manifest (draft from live Room.blend inventory)
# normal: omitted → detect_bake_maps / Bump in assembly decides T_*_N
# size_m / density for tiles are starting guesses — tune before final bake

source_blend: Art/Source/Interior/Home/Room.blend
unity_fbx: Assets/Art/Interior/Home/Models/Room.fbx
export_fbx: auto
export_objects:
  - Blackout
  - Cabinet
  - Chair
  - Door
  - Floor
  - Lamp
  - LightSwitch
  - LightSwitchButton
  - Roof
  - Sofa
  - TV
  - Table
  - Walls
  - Window

materials:
  # --- Shared library tiles / patterns ---
  - assembly: M_Walnut
    mode: tile
    size_m: [0.24, 0.96]
    density: 2133
    texture: Assets/Art/Shared/Textures/T_Walnut.png
    unity_mat: Assets/Art/Shared/Materials/M_Walnut.mat
    roughness: 0.4
    metallic: 0

  - assembly: M_HoneyOak
    mode: tile
    size_m: [0.24, 0.96]
    density: 2133
    texture: Assets/Art/Shared/Textures/T_HoneyOak.png
    unity_mat: Assets/Art/Shared/Materials/M_HoneyOak.mat
    roughness: 0.4
    metallic: 0

  - assembly: M_StainedOak
    mode: tile
    size_m: [0.24, 0.96]
    density: 2133
    texture: Assets/Art/Shared/Textures/T_StainedOak.png
    unity_mat: Assets/Art/Shared/Materials/M_StainedOak.mat
    roughness: 0.45
    metallic: 0

  - assembly: M_TaupeLacquer
    mode: tile
    size_m: [0.24, 0.96]
    density: 2133
    texture: Assets/Art/Shared/Textures/T_TaupeLacquer.png
