    roughness: 0.4
    metallic: 0

  - assembly: M_CreamBoucleFabric
    mode: tile
    size_m: [0.5, 0.5]
    density: 1024
    texture: Assets/Art/Shared/Textures/T_CreamBoucleFabric.png
    unity_mat: Assets/Art/Shared/Materials/M_CreamBoucleFabric.mat
    roughness: 0.9
    metallic: 0

  - assembly: M_BlackPlastic
    mode: tile
    size_m: [0.25, 0.25]
    density: 1024
    texture: Assets/Art/Shared/Textures/T_BlackPlastic.png
    unity_mat: Assets/Art/Shared/Materials/M_BlackPlastic.mat
    roughness: 0.45
    metallic: 0

  # --- Local unique (Room only) ---
  - assembly: M_Wallpaper
    mode: atlas
    object: Walls
    texture: Assets/Art/Interior/Home/Textures/T_Wallpaper.png
    unity_mat: Assets/Art/Interior/Home/Materials/M_Wallpaper.mat
    roughness: 0.85
    metallic: 0

  # Tile: Brick 0.96×0.12 with Mapping RotZ 90 / ScaleX 0.98 → object span ~0.245×0.96 (2 rows)
  - assembly: M_Floor
    mode: tile
    size_m: [0.245, 0.96]
    density: 2133
    texture: Assets/Art/Interior/Home/Textures/T_Floor.png
    normal: Assets/Art/Interior/Home/Textures/T_Floor_N.png
    unity_mat: Assets/Art/Interior/Home/Materials/M_Floor.mat
    roughness: 0.4
    metallic: 0

  # --- Flat shared (no bake) ---
  - assembly: M_WhitePlaster
    mode: flat
    unity_mat: Assets/Art/Shared/Materials/M_WhitePlaster.mat
    roughness: 0.8
    metallic: 0

  - assembly: M_Matte
